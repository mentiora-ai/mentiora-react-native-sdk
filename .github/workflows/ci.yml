name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Renovate rewrites these tags to pinned digests on its first run
      # (pinDigests: true in renovate.json).
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # bun run test shells out to `node --test`, and the pack step below uses
      # npm; both would otherwise run on the runner's ambient Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint

      - name: fixtures unmodified
        run: node scripts/check-fixtures.mjs

      - run: bun run test
      - run: bun run build

      - run: bunx publint --strict
      - run: bunx attw --pack .

      # Catches junk landing in the tarball (a stray build dir, node_modules,
      # a committed fixture corpus) — not a compression target. The 100KB
      # scaffold number predated the implementation and is unreachable: the
      # real package is ~120KB, and `files` ships `src` alongside `lib` on
      # purpose (scaffold.md, "package.json": source maps and debugging), so
      # even dropping every .map leaves it at ~101KB.
      - name: tarball size budget
        run: |
          SIZE=$(npm pack --ignore-scripts --dry-run --json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].size")
          echo "tarball: $SIZE bytes"
          [ "$SIZE" -lt 153600 ] || { echo "package exceeds the 150KB budget"; exit 1; }

  # Installs the packed tarball with npm, at the low end of every peer range.
  # bun and npm hoist and resolve differently, so this is what proves a consumer
  # on npm gets a working package: a phantom import fails at require time, a
  # wrong peer range fails at install time.
  consumer-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --ignore-scripts

      - name: install the tarball under npm at the peer floor
        run: |
          TARBALL="$PWD/$(ls mentiora-react-native-sdk-*.tgz)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          # react-native-safe-area-context is deliberately absent: it is an
          # optional peer and the absent path is the one that breaks.
          # @types/react is not a peer of ours, but the emitted .d.ts names
          # React.JSX.Element, so check.ts below cannot resolve `react` without
          # it. Pinned to the major that matches the react floor.
          npm install --no-audit --no-fund \
            "$TARBALL" \
            react@18 \
            react-native@0.76 \
            react-native-webview@13.6.0 \
            @react-native-async-storage/async-storage@1.23.1 \
            @types/react@18 \
            typescript@6.0.3

      - name: resolve both entries and the public types
        run: |
          cd /tmp/consumer
          # Resolution, not evaluation: an RN entry pulls in Flow-typed react-native
          # source that bare node cannot parse. What must hold is that both conditions
          # resolve to files that exist, and that the ESM .d.ts typechecks under a
          # consumer's own tsc. `--module esnext --moduleResolution bundler` only ever
          # takes the "import" condition, so lib/module/index.d.ts is the ONLY one
          # check.ts below exercises; the CJS .d.ts is covered by `attw --pack .` in
          # the `check` job, which walks every condition in the exports map.
          node -e "const p=require.resolve('@mentiora/react-native-sdk'); if(!/lib\/commonjs\/index\.js$/.test(p)) throw new Error('require resolved to '+p); console.log('cjs ok', p)"
          node --input-type=module -e "const u = await import.meta.resolve('@mentiora/react-native-sdk'); if(!/lib\/module\/index\.js$/.test(u)) throw new Error('import resolved to '+u); console.log('esm ok', u)"
          # Names EVERY exported type, from OUTSIDE the package, where a missing
          # export is a TS2305 rather than something only ../index can see. The
          # negative cases at the bottom matter as much as the positive ones: a
          # union accidentally widened to `string` passes every positive check
          # above and nothing else in the repo would notice.
          cat > check.ts <<'TS'
          import type {
            MentioraConfig,
            MentioraErrorCode,
            MentioraEvent,
            MentioraIdentity,
            MentioraIdentityCallback,
            MentioraIdentityFetcher,
            MentioraStorage,
            MentioraStrings,
            MentioraWidgetProps,
            StorageReason,
          } from '@mentiora/react-native-sdk';

          const storage: MentioraStorage = {
            getItem: async () => null,
            setItem: async () => {},
            removeItem: async () => {},
          };
          const callback: MentioraIdentityCallback = { getToken: () => 'jwt' };
          const fetcher: MentioraIdentityFetcher = {
            endpoint: 'https://api.acme.com/mentiora/token',
            headers: () => ({ Authorization: 'Bearer x' }),
            body: () => ({ scope: 'widget' }),
          };
          const identity: MentioraIdentity = callback satisfies MentioraIdentity;
          const strings: Partial<MentioraStrings> = { retry: 'Nochmal' };
          const code: MentioraErrorCode = 'handshake_timeout';
          const reason: StorageReason = 'peer-absent';

          // Every variant, so a dropped or renamed one is a compile error here
          // rather than a surprise in a customer's switch statement.
          const events: MentioraEvent[] = [
            { type: 'ready' },
            { type: 'close' },
            { type: 'identityError', reason: 'identity_required' },
            { type: 'openUrl', url: 'https://example.com' },
            { type: 'error', code },
            { type: 'storageUnavailable', reason },
          ];

          const config: MentioraConfig = {
            widgetOrigin: 'https://widget.acme.mentiora.ai',
            embedKey: 'pk_wgt_x',
            identity,
            storage,
            strings,
            onEvent: (event: MentioraEvent) => void event,
            onOpenUrl: (url: string) => url.startsWith('https:'),
          };
          const props: MentioraWidgetProps = config;

          // @ts-expect-error not a MentioraErrorCode
          const badCode: MentioraErrorCode = 'nope';
          // @ts-expect-error not a MentioraEvent variant
          const badEvent: MentioraEvent = { type: 'nope' };
          // @ts-expect-error widgetOrigin is required
          const badConfig: MentioraConfig = { embedKey: 'pk_wgt_x' };
          // @ts-expect-error not a StorageReason
          const badReason: StorageReason = 'whatever';

          export default { fetcher, events, config, props, badCode, badEvent, badConfig, badReason };
          TS
          npx tsc --noEmit --strict --moduleResolution bundler --module esnext --target esnext check.ts
          echo "types ok"
