name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # `bun run test` shells out to `node --test` and pack uses npm; without
      # this both run on the runner's ambient Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint

      - name: fixtures unmodified
        run: node scripts/check-fixtures.mjs

      - run: bun run test
      - run: bun run build

      - run: bunx publint --strict
      - run: bunx attw --pack .

      # Catches junk in the tarball, not compression. npm's `size` is the
      # compressed length, so both are checked: ~120KB packed, ~640KB unpacked.
      - name: tarball size budget
        run: |
          npm pack --ignore-scripts --dry-run --json > /tmp/pack.json
          SIZE=$(node -pe "require('/tmp/pack.json')[0].size")
          UNPACKED=$(node -pe "require('/tmp/pack.json')[0].unpackedSize")
          echo "tarball: $SIZE bytes compressed, $UNPACKED bytes unpacked"
          [ "$SIZE" -lt 153600 ] || { echo "package exceeds the 150KB compressed budget"; exit 1; }
          [ "$UNPACKED" -lt 819200 ] || { echo "package exceeds the 800KB unpacked budget"; exit 1; }

  # Installs the packed tarball under npm at the peer floor. bun and npm hoist
  # differently, so only this proves an npm consumer gets a working package.
  consumer-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --ignore-scripts

      - name: install the tarball under npm at the peer floor
        run: |
          TARBALL="$PWD/$(ls mentiora-react-native-sdk-*.tgz)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          # safe-area-context is deliberately absent: the optional-peer path is
          # the one that breaks. check.ts needs @types/react for React.JSX.Element.
          npm install --no-audit --no-fund \
            "$TARBALL" \
            react@18 \
            react-native@0.76 \
            react-native-webview@13.6.0 \
            @react-native-async-storage/async-storage@1.23.1 \
            @types/react@18 \
            typescript@6.0.3

      # Resolution cannot evaluate an RN entry (Flow source, SyntaxError under
      # bare node), so only this walk catches a missing or eager peer import.
      - name: every eager import resolves from the consumer install
        run: |
          node "$GITHUB_WORKSPACE/scripts/check-import-graph.mjs" \
            /tmp/consumer/node_modules/@mentiora/react-native-sdk/lib/module \
            /tmp/consumer

      - name: resolve both entries and the public types
        run: |
          cd /tmp/consumer
          # check.ts only exercises the ESM .d.ts; `attw --pack .` covers the CJS one.
          node -e "const p=require.resolve('@mentiora/react-native-sdk'); if(!/lib\/commonjs\/index\.js$/.test(p)) throw new Error('require resolved to '+p); console.log('cjs ok', p)"
          node --input-type=module -e "const u = await import.meta.resolve('@mentiora/react-native-sdk'); if(!/lib\/module\/index\.js$/.test(u)) throw new Error('import resolved to '+u); console.log('esm ok', u)"
          # Names every exported type from outside the package, so a missing one
          # is a TS2305. The negative cases catch a union widened to `string`.
          cat > check.ts <<'TS'
          import type {
            MentioraConfig,
            MentioraErrorCode,
            MentioraEvent,
            MentioraIdentity,
            MentioraIdentityCallback,
            MentioraIdentityFetcher,
            MentioraStorage,
            MentioraStrings,
            MentioraWidgetProps,
            StorageUnavailableReason,
          } from '@mentiora/react-native-sdk';

          const storage: MentioraStorage = {
            getItem: async () => null,
            setItem: async () => {},
            removeItem: async () => {},
          };
          const callback: MentioraIdentityCallback = { getToken: () => 'jwt' };
          const fetcher: MentioraIdentityFetcher = {
            endpoint: 'https://api.acme.com/mentiora/token',
            headers: () => ({ Authorization: 'Bearer x' }),
            body: () => ({ scope: 'widget' }),
          };
          const identity: MentioraIdentity = callback satisfies MentioraIdentity;
          const strings: Partial<MentioraStrings> = { retry: 'Nochmal' };
          const code: MentioraErrorCode = 'handshake_timeout';
          const reason: StorageUnavailableReason = 'peer-absent';

          const events: MentioraEvent[] = [
            { type: 'ready' },
            { type: 'close' },
            { type: 'identityError', reason: 'identity_required' },
            { type: 'openUrl', url: 'https://example.com' },
            { type: 'error', code },
            { type: 'storageUnavailable', reason },
          ];

          const config: MentioraConfig = {
            widgetOrigin: 'https://widget.acme.mentiora.ai',
            embedKey: 'pk_wgt_x',
            identity,
            storage,
            strings,
            onEvent: (event: MentioraEvent) => void event,
            onOpenUrl: (url: string) => url.startsWith('https:'),
          };
          const props: MentioraWidgetProps = config;

          // @ts-expect-error not a MentioraErrorCode
          const badCode: MentioraErrorCode = 'nope';
          // @ts-expect-error not a MentioraEvent variant
          const badEvent: MentioraEvent = { type: 'nope' };
          // @ts-expect-error widgetOrigin is required
          const badConfig: MentioraConfig = { embedKey: 'pk_wgt_x' };
          // @ts-expect-error 'override' means storage WORKS: it can never accompany the event
          const badReason: StorageUnavailableReason = 'override';

          export default { fetcher, events, config, props, badCode, badEvent, badConfig, badReason };
          TS
          npx tsc --noEmit --strict --moduleResolution bundler --module esnext --target esnext check.ts
          echo "types ok"
