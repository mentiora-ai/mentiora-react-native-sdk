name: Release

# A human drafts a Release in the GitHub UI; publishing it runs this workflow.
# npm matches the trusted publisher on this file's name, not on the trigger
# event, so the Releases trigger is fine.
#
# The FIRST publish cannot run here. npm's trusted publisher is configured per
# package and the package must already exist, so 0.0.1 is published once by a
# human with 2FA; every release after it comes through this workflow.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # A tag can be created against any commit from any branch, including one
      # that never passed review. Publish only what is on main.
      - name: refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD \
            || { echo "::error::${{ github.event.release.tag_name }} points at a commit that is not on main"; exit 1; }

      # Ties the tag to package.json, src/version.ts, the CHANGELOG entry and
      # the prerelease flag the publish step reads below.
      - name: assert the release is coherent
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/assert-version.mjs "${{ github.event.release.tag_name }}"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx publint --strict
      - run: bunx attw --pack .

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.
      - run: npm install -g npm@latest

      # Without an explicit dist-tag a prerelease publishes to latest and
      # reaches every consumer running a plain install.
      - name: publish
        run: |
          DIST_TAG=latest
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then DIST_TAG=next; fi
          echo "publishing under dist-tag $DIST_TAG"
          npm publish --ignore-scripts --tag "$DIST_TAG"
