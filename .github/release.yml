# Generated release notes. CHANGELOG.md is the source of truth.
# "*" catches anything no earlier category matched, so it stays last.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Bridge protocol
      labels:
        - protocol
    - title: Dependencies
      labels:
        - dependencies
    - title: Changes
      labels:
        - "*"
